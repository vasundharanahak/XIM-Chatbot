<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Envie — XIM University Chatbot</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark">X</div>
        <div class="logo-text">
          <span class="logo-name">XIM</span>
          <span class="logo-sub">University</span>
        </div>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Conversation
    </button>

    <div class="history-label">Recent</div>
    <ul class="history-list" id="historyList">
      <!-- populated by JS -->
    </ul>

    <div class="sidebar-footer">
      <div class="api-status" id="apiStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Backend: Not connected</span>
      </div>
    </div>
  </aside>

  <!-- ── OVERLAY ── -->
  <div class="overlay" id="overlay"></div>

  <!-- ── MAIN ── -->
  <main class="main">

    <!-- TOP BAR -->
    <header class="topbar">
      <button class="icon-btn" id="sidebarOpen" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="topbar-center">
        <span class="topbar-title">Envie</span>
        <span class="topbar-badge">NVIDIA RAG</span>
      </div>

      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <!-- CHAT WINDOW -->
    <section class="chat-window" id="chatWindow" role="log" aria-live="polite">

      <!-- Welcome state -->
      <div class="welcome" id="welcome">
        <div class="welcome-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <h1 class="welcome-heading">Ask Envie anything</h1>
        <p class="welcome-sub">Your AI guide to XIM University documents, policies, and programs.</p>
        <div class="suggestions" id="suggestions">
          <button class="suggestion-chip" data-q="What programs does XIM University offer?">What programs does XIM offer?</button>
          <button class="suggestion-chip" data-q="What is the admission process at XIM University?">Admission process</button>
          <button class="suggestion-chip" data-q="Tell me about XIM University's campus facilities.">Campus facilities</button>
          <button class="suggestion-chip" data-q="What scholarships are available at XIM University?">Scholarships available</button>
        </div>
      </div>

      <!-- Messages container -->
      <div class="messages" id="messages"></div>

    </section>

    <!-- INPUT AREA -->
    <footer class="input-area">
      <div class="input-wrap">
        <textarea
          id="userInput"
          class="user-input"
          placeholder="Ask about admissions, programs, faculty…"
          rows="1"
          aria-label="Type your message"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">Envie may make mistakes. Verify critical information with official XIM sources.</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
